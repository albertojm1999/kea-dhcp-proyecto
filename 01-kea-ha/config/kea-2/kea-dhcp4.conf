{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "eth0"
      ]
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "mysql",
      "host": "database-1.c7egi2ykw5yv.us-east-1.rds.amazonaws.com",
      "port": 3306,
      "name": "kea2",
      "user": "kea",
      "password": "CAMBIAR_PASSWORD_BD",
      "connect-timeout": 10,
      "max-reconnect-tries": 100,
      "reconnect-wait-time": 5000,
      "on-fail": "serve-retry-continue",
      "retry-on-startup": true
    },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "8.8.8.8, 1.1.1.1"
      }
    ],
    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
      },
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [
            {
              "this-server-name": "kea-2",
              "mode": "hot-standby",
              "heartbeat-delay": 3000,
              "max-response-delay": 10000,
              "max-ack-delay": 5000,
              "max-unacked-clients": 0,
              "multi-threading": {
                "enable-multi-threading": true,
                "http-dedicated-listener": true,
                "http-listener-threads": 0,
                "http-client-threads": 0
              },
              "peers": [
                {
                  "name": "kea-1",
                  "url": "http://172.16.10.5:8001/",
                  "role": "primary",
                  "auto-failover": true
                },
                {
                  "name": "kea-2",
                  "url": "http://172.16.40.5:8001/",
                  "role": "standby",
                  "auto-failover": true
                }
              ]
            }
          ]
        }
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "172.16.10.0/24",
        "pools": [
          {
            "pool": "172.16.10.100 - 172.16.10.200"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "172.16.10.10"
          }
        ]
      },
      {
