# Prometheus — monitorización de Kea DHCP (kea-exporter, puerto 9547)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/kea-alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kea
    scrape_interval: 10s
    static_configs:
      - targets: ["172.16.10.5:9547"]
        labels: { servidor: kea-1 }
      - targets: ["172.16.40.5:9547"]
        labels: { servidor: kea-2 }
